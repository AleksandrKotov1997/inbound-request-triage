<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #triage-status:empty { display: none; }
    dt { font-weight: 600; }
    dd { margin: 0 0 1rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form id="triage-form">
    <label for="message">Текст заявки</label>
    <textarea id="message" name="text" rows="4"></textarea>
    <button id="triage-submit" type="submit">Разобрать заявку</button>
  </form>
  <div aria-live="polite">
    <p id="triage-status"></p>
    <dl id="triage-result" hidden>
      <dt>Тема</dt>
      <dd id="triage-topic"></dd>
      <dt>Черновик ответа</dt>
      <dd id="triage-draft"></dd>
    </dl>
  </div>
  <script type="module" src="/triage/index.mjs"></script>
</body>
</html>
